<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.32" />
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Nền Squircle bo góc chuẩn iOS/Android -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)" />

  <!-- Vòng tròn nền tỏa sáng dịu -->
  <circle cx="256" cy="256" r="185" fill="#ffffff" fill-opacity="0.08" />

  <!-- Đồng tiền Vàng Tiền Đâu Rồi -->
  <g filter="url(#dropShadow)">
    <circle cx="236" cy="256" r="135" fill="url(#goldGrad)" stroke="#fef9c3" stroke-width="7" />
    <circle cx="236" cy="256" r="114" fill="none" stroke="#eab308" stroke-width="4" stroke-dasharray="10 8" />
    <!-- Ký hiệu đồng ₫ Việt Nam sắc nét -->
    <text x="236" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="140" font-weight="900" fill="#854d0e" text-anchor="middle">₫</text>
  </g>

  <!-- Huy hiệu Dấu hỏi Chấm "?" đỏ nổi bật -->
  <g transform="translate(325, 305)" filter="url(#badgeShadow)">
    <circle cx="60" cy="60" r="58" fill="#ef4444" stroke="#ffffff" stroke-width="9" />
    <text x="60" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="74" font-weight="900" fill="#ffffff" text-anchor="middle">?</text>
  </g>

  <!-- Ngôi sao lấp lánh (Sparkles) -->
  <path d="M 135 130 Q 135 155 110 155 Q 135 155 135 180 Q 135 155 160 155 Q 135 155 135 130 Z" fill="#ffffff" opacity="0.9" />
  <path d="M 375 115 Q 375 132 358 132 Q 375 132 375 149 Q 375 132 392 132 Q 375 132 375 115 Z" fill="#fef08a" opacity="0.95" />
</svg>
